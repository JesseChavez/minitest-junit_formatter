name: Main
on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Ruby ${{ matrix.ruby }} / Minitest ${{ matrix.minitest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "jruby-10"]
        minitest: ["5", "6"]
    env:
      MINITEST_VERSION: ${{ matrix.minitest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # Separate gem caches per Minitest major version.
          cache-version: minitest-${{ matrix.minitest }}

      - name: Run tests
        run: bundle exec rake test
